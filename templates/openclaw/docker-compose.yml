x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/openclaw.svg

# IMPORTANT: Starter template for OpenClaw.
# Review official production compose before deploying.
services:
  openclaw:
    image: openclaw/openclaw:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${OPENCLAW_PORT_1:-9123}:9123"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - openclaw-data:/data
    # May require DB/Redis/KVM/GPU/privileged mode or external client setup.
volumes:
  openclaw-data:
