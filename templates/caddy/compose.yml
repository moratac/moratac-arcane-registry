x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/caddy.svg

services:
  caddy:
    image: caddy:latest
    pull_policy: always
    restart: unless-stopped
    command: >
      sh -c 'mkdir -p /etc/caddy /srv &&
      if [ ! -f /etc/caddy/Caddyfile ]; then
        printf ":80 {\n  respond \"Moratac Caddy is running\"\n}\n" > /etc/caddy/Caddyfile;
      fi &&
      caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "${CADDY_HTTP_PORT:-8088}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_HTTPS_PORT:-8443}:443/udp"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_PATH:-./data}/caddy:/etc/caddy
      - ${DATA_PATH:-./data}/site:/srv
      - ${DATA_PATH:-./data}/caddy-data:/data
      - ${DATA_PATH:-./data}/caddy-config:/config
