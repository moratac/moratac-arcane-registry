x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/caddy-server-stack.svg

services:
  caddy:
    image: caddy:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8088}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_HTTPS_PORT:-8443}:443/udp"
      - "${CADDY_ADMIN_PORT:-2019}:2019"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${DATA_PATH:-./data}/caddy:/etc/caddy
      - ${DATA_PATH:-./data}/site:/srv
      - ${DATA_PATH:-./data}/caddy-data:/data
      - ${DATA_PATH:-./data}/caddy-config:/config

  caddy-manager:
    image: caddymanager/caddymanager-frontend:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${CADDY_MANAGER_PORT:-8099}:8099"
    environment:
      TZ: ${TZ:-UTC}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://caddy:2019}
    depends_on:
      - caddy
