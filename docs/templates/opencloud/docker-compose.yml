x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/opencloud.svg

# IMPORTANT: Starter template for OpenCloud.
# Review official production compose before deploying.
services:
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${OPENCLOUD_PORT_1:-9200}:9200"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - opencloud-data:/data
    # May require DB/Redis/KVM/GPU/privileged mode or external client setup.
volumes:
  opencloud-data:
