x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/vllm.svg

services:
  vllm:
    image: vllm/vllm-openai:latest
    pull_policy: always
    restart: unless-stopped
    ipc: host
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ./models:/models
    environment:
      TZ: ${TZ:-UTC}
      HF_TOKEN: ${HF_TOKEN:-}
    # Uncomment for NVIDIA GPU hosts.
