x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/romm.svg

# IMPORTANT: Starter template for RomM.
# Review official production compose before deploying.
services:
  romm:
    image: rommapp/romm:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${ROMM_PORT_1:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - romm-data:/data
    # May require DB/Redis/KVM/GPU/privileged mode or external client setup.
volumes:
  romm-data:
