x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/n8n.svg

services:
  n8n:
    image: n8nio/n8n:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${N8N_PORT_1:-5678}:5678"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - n8n-config:/config
      - ${DATA_PATH:-./data}:/data
volumes:
  n8n-config:
