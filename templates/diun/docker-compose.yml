x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/diun.svg

services:
  diun:
    image: crazymax/diun:latest
    pull_policy: always
    restart: unless-stopped
    command: serve
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-UTC}
      DIUN_PROVIDERS_DOCKER: "true"
