x-arcane:
  icon: https://moratac.github.io/moratac-arcane-registry/icons/kavita.svg

services:
  kavita:
    image: jvmilazz0/kavita:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${KAVITA_PORT_1:-5000}:5000"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - kavita-config:/config
      - ${DATA_PATH:-./data}:/data
volumes:
  kavita-config:
